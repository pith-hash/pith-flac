[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pith-flac"
version = "0.1.0"
description = "FLAC decoding SDK: STREAMINFO, constant/verbatim/fixed subframes and both Rice methods via the pith-flac Rust cdylib (ctypes, zero-dep)"
license = "MIT"
requires-python = ">=3.9"
keywords = ["flac", "audio", "decoder", "pcm", "hashing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Multimedia :: Sound/Audio",
]

[project.urls]
Repository = "https://github.com/pith-hash/pith-flac"
Homepage = "https://github.com/pith-hash/pith-flac"

[tool.setuptools]
packages = ["pith_flac"]

[tool.setuptools.package-data]
pith_flac = ["*.dll", "*.dylib", "*.so"]
